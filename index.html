<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="container">
        <div class="result_field"></div>
        <div class="result_images">
        <span class="user_result">
            <img src="images/rock.jpeg" alt="user choice">
        </span>
        <span class="Bot_result">
            <img src="images/rock.jpeg" alt="Bot choice">
        </span>
        </div>
        <!-- <div class="result_images"></div> -->
        <div class="result">Let's Play!</div>

        <div class="option_images">
            <span class="option_images">
                <img src="images/rock.jpeg" alt="">
                <p>Rock</p>
            </span>
            <span class="option_images">
                <img src="images/paper.jpeg" alt="">
                <p>Paper</p>
            </span>
            <span class="option_images">
                <img src="images/scissor.jpeg" alt="">
                <p>Scissors</p>
            </span>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
